name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - id: auth account
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1024478612612/locations/global/workloadIdentityPools/github/providers/my-repo
          service_account: cloud-run-deployer@notely-513318.iam.gserviceaccount.com
          
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Build 
        run: ./scripts/buildprod.sh

      - name: Set Up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"

      - name: glcoud build
         run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-513318/notely-ar-repo/notely:latest .
